services:
  traefik:
    image: traefik:v3.6.6
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${PREVIEW_EDGE_NETWORK}
      - --entrypoints.web.address=:80
      - --ping=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping=true]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - preview-edge
    restart: unless-stopped

  preview-webhook-router:
    build:
      context: .
      dockerfile: scripts/preview-webhook-router/Dockerfile
    environment:
      PREVIEW_WEBHOOK_SECRET: ${PREVIEW_WEBHOOK_SECRET}
      PREVIEW_ROUTE_SECRET: ${PREVIEW_ROUTE_SECRET}
      ROUTER_STATE_DIR: /data
    depends_on:
      traefik:
        condition: service_healthy
    volumes:
      - preview-router-state:/data
    networks:
      - preview-edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.preview-webhook.rule: Host(`preview-webhooks.fluentflow.tech`)
      traefik.http.services.preview-webhook.loadbalancer.server.port: "3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); })"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    environment:
      TUNNEL_TOKEN: ${PREVIEW_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://traefik:80
      - run
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - preview-edge
    restart: unless-stopped

volumes:
  preview-router-state:
    name: fluent-flow-preview-router-state

networks:
  preview-edge:
    external: true
    name: ${PREVIEW_EDGE_NETWORK}
