name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dedicated ff_* test databases only (see packages/*/tests/helpers/collab-db.*).
      COLLAB_DB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ff_db_test
      COLLAB_ROUTES_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ff_server_test
      COLLAB_CONNECTOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ff_connector_test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install all dependencies (clean, workaround npm optional deps bug)
        run: |
          rm -f package-lock.json
          npm install

      # Service containers start before checkout, so the databases cannot be
      # created via init scripts bind-mounted from the workspace. Create them
      # explicitly once dependencies (pg) are available.
      - name: Create dedicated collaboration test databases
        run: |
          node -e "
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: 'postgres://postgres:postgres@127.0.0.1:5432/postgres' });
            await client.connect();
            for (const db of ['ff_db_test', 'ff_server_test', 'ff_connector_test', 'ff_legacy_test']) {
              await client.query('CREATE DATABASE ' + db);
            }
            await client.end();
          })().catch((err) => { console.error(err); process.exit(1); });
          "

      - name: Check migration journal consistency
        run: bash scripts/check-migrations.sh

      - name: Run all tests (turbo fans out to every workspace; `test` depends on `^build`)
        run: npm test

      - name: Typecheck runner connector
        run: npm run typecheck -w @fluent-flow/runner

      - name: Exercise existing runner claim SQL against an independent database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ff_legacy_test
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ff_legacy_test
        run: |
          node --input-type=module -e "import { runMigrations,closePool } from '@fluent-flow/db'; await runMigrations(); await closePool();"
          npm test -w fluent-flow -- tests/integration/claim-pending-work.test.js
