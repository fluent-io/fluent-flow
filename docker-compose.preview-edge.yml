services:
  traefik:
    image: traefik:v3.5
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${PREVIEW_EDGE_NETWORK}
      - --entrypoints.web.address=:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - preview-edge
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    environment:
      TUNNEL_TOKEN: ${PREVIEW_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://traefik:80
      - run
    depends_on:
      - traefik
    networks:
      - preview-edge
    restart: unless-stopped

networks:
  preview-edge:
    external: true
    name: ${PREVIEW_EDGE_NETWORK}
