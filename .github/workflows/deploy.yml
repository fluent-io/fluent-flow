name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_only:
        description: 'Print validated secret/env fingerprints without deploying'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    name: Deploy to G10
    runs-on: [self-hosted, linux, x64, g10]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          FF_GITHUB_APP_ID: ${{ vars.FF_GITHUB_APP_ID }}
          FF_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FF_GITHUB_APP_PRIVATE_KEY }}
          FF_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.FF_GITHUB_APP_WEBHOOK_SECRET }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FF_GITHUB_CLIENT_ID: ${{ secrets.FF_GITHUB_CLIENT_ID }}
          FF_GITHUB_CLIENT_SECRET: ${{ secrets.FF_GITHUB_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            FF_GITHUB_APP_ID
            FF_GITHUB_APP_PRIVATE_KEY
            FF_GITHUB_APP_WEBHOOK_SECRET
            MCP_AUTH_TOKEN
            POSTGRES_PASSWORD
            FF_GITHUB_CLIENT_ID
            FF_GITHUB_CLIENT_SECRET
            NEXTAUTH_SECRET
            NEXTAUTH_URL
          )
          for key in "${required[@]}"; do
            value=${!key:-}
            if [ -z "$value" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
            if [ "$value" = "-" ]; then
              echo "Invalid placeholder value for: $key" >&2
              exit 1
            fi
          done

          python3 - <<PY
import hashlib, os
for key in [
    "FF_GITHUB_CLIENT_ID",
    "FF_GITHUB_CLIENT_SECRET",
    "NEXTAUTH_SECRET",
]:
    value = os.environ[key]
    print(
        f"{key}: len={len(value)} prefix={value[:4]} suffix={value[-4:]} sha256={hashlib.sha256(value.encode()).hexdigest()}"
    )
PY

      - name: Write runtime env file
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          FF_GITHUB_APP_ID: ${{ vars.FF_GITHUB_APP_ID }}
          FF_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FF_GITHUB_APP_PRIVATE_KEY }}
          FF_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.FF_GITHUB_APP_WEBHOOK_SECRET }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FF_GITHUB_CLIENT_ID: ${{ secrets.FF_GITHUB_CLIENT_ID }}
          FF_GITHUB_CLIENT_SECRET: ${{ secrets.FF_GITHUB_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          env_file=$(mktemp /tmp/fluent-flow-deploy.XXXXXX.env)
          private_key_value=$(printf '%s' "${FF_GITHUB_APP_PRIVATE_KEY}")
          if printf '%s' "$private_key_value" | grep -q 'BEGIN '; then
            private_key_value=$(printf '%s' "$private_key_value" | base64 | tr -d '\n')
          fi
          cat > "$env_file" <<EOF
          DATABASE_URL=${DATABASE_URL}
          FF_GITHUB_APP_ID=${FF_GITHUB_APP_ID}
          FF_GITHUB_APP_PRIVATE_KEY=${private_key_value}
          FF_GITHUB_APP_WEBHOOK_SECRET=${FF_GITHUB_APP_WEBHOOK_SECRET}
          MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          GITHUB_CLIENT_ID=${FF_GITHUB_CLIENT_ID}
          GITHUB_CLIENT_SECRET=${FF_GITHUB_CLIENT_SECRET}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          NEXTAUTH_URL=${NEXTAUTH_URL}
          EOF
          chmod 600 "$env_file"
          printf 'DEPLOY_ENV_FILE=%s\n' "$env_file" >> "$GITHUB_ENV"

      - name: Debug runtime env fingerprints
        run: |
          set -euo pipefail
          python3 - <<PY
import hashlib
from pathlib import Path
values = {}
for raw in Path("$DEPLOY_ENV_FILE").read_text().splitlines():
    if not raw or raw.startswith('#') or '=' not in raw:
        continue
    key, value = raw.split('=', 1)
    values[key] = value
for key in [
    "GITHUB_CLIENT_ID",
    "GITHUB_CLIENT_SECRET",
    "NEXTAUTH_SECRET",
]:
    value = values[key]
    print(
        f"{key}: len={len(value)} prefix={value[:4]} suffix={value[-4:]} sha256={hashlib.sha256(value.encode()).hexdigest()}"
    )
PY

      - name: Stop after debug fingerprinting
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_only }}
        run: |
          echo "Debug-only dispatch requested, stopping before deploy."
          exit 0

      - name: Write deployment override
        run: |
          set -euo pipefail
          cat > docker-compose.override.yml <<'EOF'
          services:
            fluent-flow:
              environment:
                OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
                OTEL_SERVICE_NAME: fluent-flow
              networks:
                - fluent-flow-net
                - signoz-net

            dashboard:
              environment:
                NODE_ENV: production
              networks:
                - fluent-flow-net
                - signoz-net

          networks:
            signoz-net:
              external: true
          EOF

      - name: Verify Signoz network
        run: |
          docker network inspect signoz-net >/dev/null 2>&1 || {
            echo "Missing required Docker network: signoz-net" >&2
            exit 1
          }

      - name: Validate compose config
        run: |
          docker compose --env-file "$DEPLOY_ENV_FILE" -f docker-compose.yml -f docker-compose.override.yml config >/dev/null

      - name: Build and deploy
        run: docker compose --env-file "$DEPLOY_ENV_FILE" -f docker-compose.yml -f docker-compose.override.yml up -d --build --remove-orphans

      - name: Wait for fluent-flow health endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:3847/api/health > /tmp/fluent-flow-health.json; then
              cat /tmp/fluent-flow-health.json
              exit 0
            fi
            sleep 5
          done
          echo "fluent-flow health check failed" >&2
          docker compose --env-file "$DEPLOY_ENV_FILE" -f docker-compose.yml -f docker-compose.override.yml ps
          exit 1

      - name: Show running services
        if: always()
        run: docker compose --env-file "$DEPLOY_ENV_FILE" -f docker-compose.yml -f docker-compose.override.yml ps

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose --env-file "$DEPLOY_ENV_FILE" -f docker-compose.yml -f docker-compose.override.yml logs --tail=200 fluent-flow dashboard || true

      - name: Clean deployment secrets
        if: always()
        run: rm -f "$DEPLOY_ENV_FILE" docker-compose.override.yml
