name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to G10
    runs-on: [self-hosted, linux, x64, g10]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FF_GITHUB_APP_ID: ${{ secrets.FF_GITHUB_APP_ID }}
          FF_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FF_GITHUB_APP_PRIVATE_KEY }}
          FF_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.FF_GITHUB_APP_WEBHOOK_SECRET }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            FF_GITHUB_APP_ID
            FF_GITHUB_APP_PRIVATE_KEY
            FF_GITHUB_APP_WEBHOOK_SECRET
            MCP_AUTH_TOKEN
            POSTGRES_PASSWORD
            GITHUB_CLIENT_ID
            GITHUB_CLIENT_SECRET
            NEXTAUTH_SECRET
            NEXTAUTH_URL
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done

      - name: Write runtime env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FF_GITHUB_APP_ID: ${{ secrets.FF_GITHUB_APP_ID }}
          FF_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FF_GITHUB_APP_PRIVATE_KEY }}
          FF_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.FF_GITHUB_APP_WEBHOOK_SECRET }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          FF_GITHUB_APP_ID=${FF_GITHUB_APP_ID}
          FF_GITHUB_APP_PRIVATE_KEY=${FF_GITHUB_APP_PRIVATE_KEY}
          FF_GITHUB_APP_WEBHOOK_SECRET=${FF_GITHUB_APP_WEBHOOK_SECRET}
          MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
          GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          NEXTAUTH_URL=${NEXTAUTH_URL}
          EOF
          chmod 600 .env

      - name: Ensure deployment override exists
        run: |
          set -euo pipefail
          if [ ! -f docker-compose.override.yml ]; then
            cat > docker-compose.override.yml <<'EOF'
          services:
            fluent-flow:
              environment:
                NODE_OPTIONS: --require ./src/tracing.cjs
                OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
                OTEL_SERVICE_NAME: fluent-flow
              networks:
                - fluent-flow-net
                - signoz-net

            dashboard:
              environment:
                NODE_ENV: production
              networks:
                - fluent-flow-net
                - signoz-net

          networks:
            signoz-net:
              external: true
          EOF
          fi

      - name: Validate compose config
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config

      - name: Build and deploy
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build --remove-orphans

      - name: Wait for fluent-flow health endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3847/health > /tmp/fluent-flow-health.json; then
              cat /tmp/fluent-flow-health.json
              exit 0
            fi
            sleep 5
          done
          echo "fluent-flow health check failed" >&2
          docker compose -f docker-compose.yml -f docker-compose.override.yml ps
          exit 1

      - name: Show running services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml ps
