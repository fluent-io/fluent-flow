name: fluent-flow-agent-server

services:
  agent-server:
    image: ghcr.io/fluent-io/fluent-flow-agent-server:latest
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/node:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      FLUENT_FLOW_TOKEN_FILE: /run/secrets/fluent-flow-token
    command:
      - --server
      - ${FLUENT_FLOW_SERVER:?Set FLUENT_FLOW_SERVER to your Fluent Flow URL}
      - --provider
      - ${AGENT_PROVIDER:?Set AGENT_PROVIDER to claude-code or codex}
      - --capacity
      - ${AGENT_CAPACITY:-2}
      - --deployment
      - self_hosted
      - --provider-secret-file
      - /run/secrets/provider-auth
    secrets:
      - source: provider_auth
        target: provider-auth
      - source: fluent_flow_token
        target: fluent-flow-token
    volumes:
      - fluent-flow-state:/home/node/.fluent-flow
      - fluent-flow-work:/work

secrets:
  provider_auth:
    file: ${PROVIDER_AUTH_FILE:?Set PROVIDER_AUTH_FILE to the provider secret file path}
  fluent_flow_token:
    file: ${FLUENT_FLOW_TOKEN_SECRET_FILE:?Set FLUENT_FLOW_TOKEN_SECRET_FILE to the durable token file path}

volumes:
  fluent-flow-state:
  fluent-flow-work:
