services:
  fluent-flow:
    build:
      context: .
      dockerfile: packages/fluent-flow/Dockerfile
    container_name: fluent-flow
    ports:
      - "3847:3847"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fluentflow:password@postgres:5432/fluentflow}
      FF_GITHUB_APP_ID: ${FF_GITHUB_APP_ID:-}
      FF_GITHUB_APP_PRIVATE_KEY: ${FF_GITHUB_APP_PRIVATE_KEY:-}
      FF_GITHUB_APP_WEBHOOK_SECRET: ${FF_GITHUB_APP_WEBHOOK_SECRET:-}
      PORT: 3847
      CONFIG_CACHE_TTL_MS: 300000
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    volumes:
      - ./packages/fluent-flow/config:/app/packages/fluent-flow/config:ro
    networks:
      - fluent-flow-net
    restart: unless-stopped

  # Dashboard (Next.js admin UI)
  # Requires environment variables:
  #   - DATABASE_URL (postgres://fluentflow:password@postgres:5432/fluentflow)
  #   - GITHUB_CLIENT_ID (GitHub OAuth app client ID)
  #   - GITHUB_CLIENT_SECRET (GitHub OAuth app secret)
  #   - NEXTAUTH_SECRET (random string for NextAuth.js encryption)
  #   - NEXTAUTH_URL (optional, defaults to http://localhost:3000)
  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: fluent-flow-dashboard
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fluentflow:password@postgres:5432/fluentflow}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    networks:
      - fluent-flow-net
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: fluentflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fluent-flow-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  fluent-flow-net:
    driver: bridge
