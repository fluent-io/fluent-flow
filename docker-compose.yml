services:
  fluent-flow:
    build:
      context: .
      dockerfile: packages/fluent-flow/Dockerfile
    container_name: fluent-flow
    ports:
      - "3847:3847"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fluentflow:password@postgres:5432/fluentflow}
      FF_GITHUB_APP_ID: ${FF_GITHUB_APP_ID:-}
      FF_GITHUB_APP_PRIVATE_KEY: ${FF_GITHUB_APP_PRIVATE_KEY:-}
      FF_GITHUB_APP_WEBHOOK_SECRET: ${FF_GITHUB_APP_WEBHOOK_SECRET:-}
      FF_COLLAB_AUTH_SECRET: ${FF_COLLAB_AUTH_SECRET}
      PORT: 3847
      CONFIG_CACHE_TTL_MS: 300000
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    volumes:
      - ./packages/fluent-flow/config:/app/packages/fluent-flow/config:ro
    networks:
      - fluent-flow-net
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3847/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Dashboard (Next.js admin UI)
  # Requires environment variables:
  #   - DATABASE_URL (postgres://fluentflow:password@postgres:5432/fluentflow)
  #   - GITHUB_CLIENT_ID (GitHub OAuth app client ID)
  #   - GITHUB_CLIENT_SECRET (GitHub OAuth app secret)
  #   - NEXTAUTH_SECRET (random string for NextAuth.js encryption)
  #   - NEXTAUTH_URL (optional, defaults to http://localhost:3000)
  #   - FF_COLLAB_AUTH_SECRET (same private value as the fluent-flow service)
  #   - FF_COLLAB_API_URL (defaults to the in-network fluent-flow service)
  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: fluent-flow-dashboard
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fluentflow:password@postgres:5432/fluentflow}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      FF_COLLAB_AUTH_SECRET: ${FF_COLLAB_AUTH_SECRET}
      FF_COLLAB_API_URL: ${FF_COLLAB_API_URL:-http://fluent-flow:3847}
    networks:
      - fluent-flow-net
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_started
      fluent-flow:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: fluentflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fluent-flow-net
    restart: unless-stopped

  agent-server:
    profiles:
      - hosted-agent
    image: ghcr.io/fluent-io/fluent-flow-agent-server:${AGENT_SERVER_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/node:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      FLUENT_FLOW_TOKEN_FILE: /run/secrets/fluent-flow-token
    command:
      - --server
      - ${AGENT_SERVER_FLUENT_FLOW_URL:-https://set-AGENT_SERVER_FLUENT_FLOW_URL.invalid}
      - --provider
      - ${AGENT_SERVER_PROVIDER:-claude-code}
      - --capacity
      - ${AGENT_SERVER_CAPACITY:-2}
      - --deployment
      - hosted
      - --provider-secret-file
      - /run/secrets/provider-auth
    secrets:
      - source: provider_auth
        target: provider-auth
      - source: fluent_flow_token
        target: fluent-flow-token
    volumes:
      - agent-server-state:/home/node/.fluent-flow
      - agent-server-work:/work

volumes:
  pgdata:
  agent-server-state:
  agent-server-work:

secrets:
  provider_auth:
    file: ${AGENT_SERVER_PROVIDER_AUTH_FILE:-/nonexistent/set-AGENT_SERVER_PROVIDER_AUTH_FILE}
  fluent_flow_token:
    file: ${AGENT_SERVER_TOKEN_FILE:-/nonexistent/set-AGENT_SERVER_TOKEN_FILE}

networks:
  fluent-flow-net:
    driver: bridge
